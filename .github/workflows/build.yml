name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: SubRooRooms_VST3 SubRooRooms_CLAP SubRooRooms_Standalone
          - name: macOS
            os: macos-15
            targets: SubRooRooms_VST3 SubRooRooms_AU SubRooRooms_CLAP SubRooRooms_Standalone
          - name: Linux
            os: ubuntu-22.04
            targets: SubRooRooms_VST3 SubRooRooms_CLAP SubRooRooms_LV2 SubRooRooms_Standalone

    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libxi-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl-dev libjack-jackd2-dev xvfb ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -B build $GEN -DCMAKE_BUILD_TYPE=Release -DSUBROO_BUILD_TESTS=ON

      - name: Build plug-ins
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      - name: Version
        shell: bash
        run: |
          VER=$(sed -n 's/^project(SubRooRooms VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::warning::tag ${GITHUB_REF#refs/tags/} does not match CMake version $VER"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "NUMVER=$VER.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          A="build/SubRooRooms_artefacts/Release"
          mkdir -p dist
          cp -R "$A/VST3/SubRoo Rooms.vst3" dist/
          cp -R "$A/CLAP/SubRoo Rooms.clap" dist/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "$A/AU/SubRoo Rooms.component" dist/
            cp -R "$A/Standalone/SubRoo Rooms.app" dist/
            for b in dist/*.vst3 dist/*.component dist/*.clap dist/*.app; do codesign --force --deep -s - "$b"; done
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cp "$A/Standalone/SubRoo Rooms.exe" dist/
          else
            cp -R "$A/LV2/SubRoo Rooms.lv2" dist/
            cp "$A/Standalone/SubRoo Rooms" dist/
            cp scripts/install_linux.sh dist/
          fi
          cp README.md dist/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: SubRoo-Rooms-${{ matrix.name }}
          path: dist/

      # ------------------------------------------------------------ Windows installer
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "Using $($iscc.FullName)"
          $key = (Get-Content installer\packs-key.txt -Raw).Trim()
          & $iscc.FullName /Qp "/DAppVersion=$env:VER" "/DNumericVersion=$env:NUMVER" `
            "/DBuildDir=$PWD\build\SubRooRooms_artefacts\Release" "/DOutputDir=$PWD\dist-installer" `
            "/DPackKey=$key" installer\windows\SubRooRooms.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist-installer

      - name: Installer test (install, update in place, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist-installer\*.exe | Select-Object -First 1).FullName
          $packs = "$env:ProgramData\SubRoo Rooms\Packs"
          $vst3 = "$env:CommonProgramFiles\VST3\SubRoo Rooms.vst3"
          $clap = "$env:CommonProgramFiles\CLAP\SubRoo Rooms.clap"
          $app = "$env:ProgramFiles\SubRoo\SubRoo Rooms"
          function Fail($m) { Write-Host "::error::$m"; if (Test-Path install.log) { Get-Content install.log -Tail 80 }; exit 1 }

          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "setup exit code $($p.ExitCode)" }
          foreach ($f in @("$vst3\Contents\x86_64-win\SubRoo Rooms.vst3", $clap, "$app\SubRoo Rooms.exe", "$packs\.packs-version")) {
            if (!(Test-Path $f)) { Fail "missing $f" }
          }
          $n = (Get-ChildItem $packs -Directory).Count
          Write-Host "packs installed: $n"
          if ($n -lt 200) { Fail "only $n packs" }
          $stamp = (Get-Item "$packs\.packs-version").LastWriteTimeUtc

          # second run = update in place; packs are current, so nothing is downloaded again
          $t = Get-Date
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install2.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "update exit code $($p.ExitCode)" }
          if ((Get-Item "$packs\.packs-version").LastWriteTimeUtc -ne $stamp) { Fail "packs were reinstalled although up to date" }
          Write-Host "update in place took $([int]((Get-Date) - $t).TotalSeconds) s"

          # uninstall
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep 1 }
          foreach ($f in @($vst3, $clap, "$app\SubRoo Rooms.exe", $packs)) { if (Test-Path $f) { Fail "not removed: $f" } }
          Write-Host "install / update / uninstall OK"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SubRoo-Rooms-Windows-Installer
          path: dist-installer/*.exe

      # ------------------------------------------------------------ macOS installer
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 7zmac
          gh release download --repo ip7z/7zip --pattern '*-mac.tar.xz' -D 7zmac
          tar -xf 7zmac/*-mac.tar.xz -C 7zmac
          installer/macos/build_pkg.sh "build/SubRooRooms_artefacts/Release" "$VER" dist-installer \
            "$(tr -d '\r\n' < installer/packs-key.txt)" 7zmac/7zz

      - name: Installer test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo installer -pkg dist-installer/*.pkg -target /
          sudo cat "/Library/Logs/SubRoo Rooms Install.log" || true
          for f in "/Library/Audio/Plug-Ins/VST3/SubRoo Rooms.vst3" "/Library/Audio/Plug-Ins/Components/SubRoo Rooms.component" \
                   "/Library/Audio/Plug-Ins/CLAP/SubRoo Rooms.clap" "/Applications/SubRoo Rooms.app" \
                   "/Library/Application Support/SubRoo Rooms/Packs/.packs-version"; do
            [ -e "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          n=$(find "/Library/Application Support/SubRoo Rooms/Packs" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "packs installed: $n"; [ "$n" -ge 200 ] || exit 1

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: SubRoo-Rooms-macOS-Installer
          path: dist-installer/*.pkg

      - name: Build tests
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target SubRooRoomsTests SubRooRoomsHostCheck

      - name: Engine tests
        shell: bash
        run: |
          T=$(find build -name "SubRooRoomsTests" -type f -perm -u+x -o -name "SubRooRoomsTests.exe" -type f | head -1)
          "$T" test-output

      - name: Host check (loads the VST3 like a DAW)
        shell: bash
        continue-on-error: true
        run: |
          H=$(find build -name "SubRooRoomsHostCheck" -type f -perm -u+x -o -name "SubRooRoomsHostCheck.exe" -type f | head -1)
          V="build/SubRooRooms_artefacts/Release/VST3/SubRoo Rooms.vst3"
          if [ "$RUNNER_OS" == "Linux" ]; then xvfb-run -a "$H" "$V"; else "$H" "$V"; fi

      - name: pluginval
        shell: bash
        continue-on-error: true
        run: |
          V="$PWD/build/SubRooRooms_artefacts/Release/VST3/SubRoo Rooms.vst3"
          if [ "$RUNNER_OS" == "Linux" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
            unzip -q pv.zip; xvfb-run -a ./pluginval --strictness-level 5 --timeout-ms 600000 --validate "$V"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip; ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 600000 --validate "$V"
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pv.zip; ./pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "$V"
          fi

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: example-impulse-responses
          path: test-output/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir release
          cp artifacts/SubRoo-Rooms-Windows-Installer/*.exe release/
          cp artifacts/SubRoo-Rooms-macOS-Installer/*.pkg release/
          (cd artifacts/SubRoo-Rooms-Linux && zip -qr "../../release/SubRoo-Rooms-${GITHUB_REF_NAME#v}-Linux.zip" .)
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          name: SubRoo Rooms ${{ github.ref_name }}
          body: |
            **Windows:** download `SubRoo-Rooms-…-Windows-Setup.exe` and run it. It installs the VST3 + CLAP plug-ins, the standalone app and downloads all measured location packs. A newer version installs over the old one.
            **macOS:** download `SubRoo-Rooms-…-macOS.pkg`, right-click → Open (the installer is not notarized yet). Installs AU + VST3 + CLAP + app + packs.
            **Linux:** zip with VST3 / CLAP / LV2 / standalone.
          files: release/*
